<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/camelot-icon.png" />
    <link rel="apple-touch-icon" href="/camelot-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title><%= VITE_APP_TITLE %></title>
    <!-- Cinzel + Inter are self-hosted via @font-face in src/css/main.css (full offline play). -->
    <link rel="stylesheet" href="/src/css/main.css">
    <link rel="stylesheet" href="/src/css/polish.css">
    <link rel="stylesheet" href="/src/css/tome.css">
</head>

<body>
    <!-- Shown from first paint until the title opens (ui/boot-cover.ts). -->
    <div id="boot-cover" role="status" aria-live="polite">
        <div class="boot-cover__name">Camelot</div>
        <div class="boot-cover__line">The tale is being set down<span class="boot-cover__dots" aria-hidden="true"></span></div>
    </div>
    <style>
        #boot-cover { position: fixed; inset: 0; z-index: 9000; display: grid; place-content: center; gap: 18px;
            text-align: center; background: radial-gradient(ellipse at center, #140c06, #030201 78%); color: #c9b48a;
            transition: opacity 350ms ease-out; }
        #boot-cover.is-gone { opacity: 0; pointer-events: none; }
        .boot-cover__name { font: 600 clamp(40px, 8vw, 84px)/1 "Cinzel", Georgia, serif; letter-spacing: 0.08em;
            text-transform: uppercase; color: #d8bf86; text-shadow: 0 2px 18px rgba(0, 0, 0, 0.8); }
        .boot-cover__line { font: italic 18px/1.4 "EB Garamond", Georgia, serif; color: rgba(201, 180, 138, 0.75); }
        .boot-cover__dots::after { content: ""; display: inline-block; width: 1.2em; text-align: left;
            animation: boot-dots 1.6s steps(4, end) infinite; }
        @keyframes boot-dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
        @media (prefers-reduced-motion: reduce) { #boot-cover { transition: none; } .boot-cover__dots::after { animation: none; content: "..."; } }
    </style>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
