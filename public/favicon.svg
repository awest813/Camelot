<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2b"/>
      <stop offset="50%" stop-color="#1b283d"/>
      <stop offset="100%" stop-color="#0d1420"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe270"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6f0fa"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b0c4de"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Outline -->
  <path d="M 32 3 C 48 3 56 7 56 18 C 56 38 45 53 32 61 C 19 53 8 38 8 18 C 8 7 16 3 32 3 Z"
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Inner Inset Border -->
  <path d="M 32 7 C 45 7 51 10.5 51 19 C 51 35.5 41.5 48 32 55 C 22.5 48 13 35.5 13 19 C 13 10.5 19 7 32 7 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.6" />

  <!-- Sword Blade (Behind Crown) -->
  <polygon points="32,10 34.5,23 33.5,45 30.5,45 29.5,23" fill="url(#bladeGrad)" filter="url(#glow)" />
  <line x1="32" y1="12" x2="32" y2="44" stroke="#9bb7d4" stroke-width="0.75" />

  <!-- Sword Crossguard -->
  <rect x="23" y="44" width="18" height="3" rx="1.5" fill="url(#goldGrad)" />
  <!-- Sword Grip & Pommel -->
  <rect x="30.5" y="47" width="3" height="6" rx="0.5" fill="#5c3818" />
  <circle cx="32" cy="54.5" r="2.2" fill="url(#goldGrad)" />

  <!-- Crown (Over Sword) -->
  <path d="M 19 32 L 21 21 L 27 27 L 32 17 L 37 27 L 43 21 L 45 32 Z"
        fill="url(#goldGrad)" stroke="#61410b" stroke-width="0.5" filter="url(#glow)" />
  <path d="M 18 32 Q 32 35 46 32 L 45 35 Q 32 38 19 35 Z" fill="url(#goldGrad)" stroke="#4a3004" stroke-width="0.5" />

  <!-- Crown Jewels -->
  <circle cx="32" cy="33.5" r="1.3" fill="#e62020" />
  <circle cx="26" cy="33" r="1" fill="#2070e6" />
  <circle cx="38" cy="33" r="1" fill="#2070e6" />
  <circle cx="32" cy="18" r="0.9" fill="#e6f0fa" />
</svg>
